function simpleHash(str) {
  let hash = 0;
  for(let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash = hash & hash;
  }
  return Math.abs(hash).toString(16);
}

const STORAGE_KEY = "itqan_artsfest_final_working";
let programs = [];
let othelloAssignments = {}, macbethAssignments = {}, hamletAssignments = {};
let students = [];
let currentPointsTarget = null;
let currentCandidatesTarget = null;

function resetAllData() {
  if(confirm("⚠️ RESET ALL DATA? This will restore original programs and students.")) {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem("itqan_credentials");
    initData();
    renderAll();
    alert("✅ Data reset successfully! Please reload the page.");
    window.location.reload();
  }
}

function openSettingsModal() {
  document.getElementById("adminPass").value = "";
  document.getElementById("othelloPass").value = "";
  document.getElementById("macbethPass").value = "";
  document.getElementById("hamletPass").value = "";
  document.getElementById("settingsModal").classList.add("active");
}

function savePasswords() {
  let creds = localStorage.getItem("itqan_credentials");
  if(!creds) {
    creds = JSON.stringify(DEFAULT_CREDENTIALS);
  }
  creds = JSON.parse(creds);
  const adminPass = document.getElementById("adminPass").value.trim();
  const othelloPass = document.getElementById("othelloPass").value.trim();
  const macbethPass = document.getElementById("macbethPass").value.trim();
  const hamletPass = document.getElementById("hamletPass").value.trim();
  
  if(adminPass) creds.admin.passwordHash = simpleHash(adminPass);
  if(othelloPass) creds.othello.passwordHash = simpleHash(othelloPass);
  if(macbethPass) creds.macbeth.passwordHash = simpleHash(macbethPass);
  if(hamletPass) creds.hamlet.passwordHash = simpleHash(hamletPass);
  
  localStorage.setItem("itqan_credentials", JSON.stringify(creds));
  alert("✅ Passwords updated successfully!");
  closeModal("settingsModal");
}

function initData() {
  programs = [];
  othelloAssignments = {};
  macbethAssignments = {};
  hamletAssignments = {};
  
  for(let p of PROGRAMS_DATA) {
    programs.push({
      code: p.code,
      name: p.name,
      time: p.time,
      category: p.category,
      maxPoints: p.maxPoints
    });
    
    othelloAssignments[p.code] = { 
      candidates: p.othello ? p.othello.split(',').map(s=>s.trim()).filter(s=>s) : [], 
      pointsEarned: 0 
    };
    macbethAssignments[p.code] = { 
      candidates: p.macbeth ? p.macbeth.split(',').map(s=>s.trim()).filter(s=>s) : [], 
      pointsEarned: 0 
    };
    hamletAssignments[p.code] = { 
      candidates: p.hamlet ? p.hamlet.split(',').map(s=>s.trim()).filter(s=>s) : [], 
      pointsEarned: 0 
    };
  }
  
  students = JSON.parse(JSON.stringify(STUDENTS));
  
  const saved = localStorage.getItem(STORAGE_KEY);
  if(saved) {
    try {
      const d = JSON.parse(saved);
      if(d.programs) programs = d.programs;
      if(d.othelloAssignments) othelloAssignments = d.othelloAssignments;
      if(d.macbethAssignments) macbethAssignments = d.macbethAssignments;
      if(d.hamletAssignments) hamletAssignments = d.hamletAssignments;
      if(d.students) students = d.students;
    } catch(e) {}
  }
  
  saveToLocal();
}

function saveToLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    programs, othelloAssignments, macbethAssignments, hamletAssignments, students
  }));
}

function getTeamAssignments(team) {
  if(team === "othello") return othelloAssignments;
  if(team === "macbeth") return macbethAssignments;
  return hamletAssignments;
}

function setTeamAssignments(team, data) {
  if(team === "othello") othelloAssignments = data;
  else if(team === "macbeth") macbethAssignments = data;
  else hamletAssignments = data;
  saveToLocal();
}

function updateStudentPoints() {
  students.forEach(s => { s.points = 0; s.programs = []; });
  const teams = ["othello","macbeth","hamlet"];
  for(let team of teams) {
    const assign = getTeamAssignments(team);
    for(let code in assign) {
      const prog = programs.find(p => p.code === code);
      if(prog && assign[code].pointsEarned) {
        for(let candId of assign[code].candidates) {
          const student = students.find(s => s.id === candId);
          if(student && student.team === team) {
            student.points += assign[code].pointsEarned;
            if(!student.programs.includes(code)) student.programs.push(code);
          }
        }
      }
    }
  }
  saveToLocal();
}

function renderAll() {
  updateStudentPoints();
  renderProgramPanels();
  renderStandings();
  renderStudents();
}

function renderProgramPanels() {
  const teams = ["othello", "macbeth", "hamlet"];
  for(let team of teams) {
    const assign = getTeamAssignments(team);
    const panel = document.getElementById(`${team}Panel`);
    if(!panel) continue;
    
    let html = `<div class="stats-bar"><span>🏆 ${team.toUpperCase()} TEAM</span><span class="count-badge">${programs.length} Programs</span></div>
    <div class="table-wrapper"><table><thead><tr><th>Code</th><th>Program Name</th><th>Time</th><th>Category</th><th>Candidates</th><th>Points</th><th>Actions</th></tr></thead><tbody>`;
    
    for(let p of programs) {
      const assignment = assign[p.code] || { candidates: [], pointsEarned: 0 };
      let catClass = "";
      if(p.category === "Stage") catClass = "stage-badge";
      else if(p.category === "Non-Stage") catClass = "nonstage-badge";
      else if(p.category === "Group") catClass = "group-badge";
      else catClass = "sports-badge";
      
      html += `<tr>
        <td><strong>${p.code}</strong></td>
        <td>${p.name}</td>
        <td>${p.time}</td>
        <td><span class="badge ${catClass}">${p.category}</span></td>
        <td>${assignment.candidates.length > 0 ? assignment.candidates.map(c => `<span class="candidate-tag">${c}</span>`).join('') : '<span style="color:#aaa;">—</span>'}</td>
        <td><strong>${assignment.pointsEarned || 0}</strong> / ${p.maxPoints}</td>
        <td class="action-buttons">
          <button class="btn-edit" onclick="openCandidatesModal('${team}','${p.code}')"><i class="fas fa-users"></i> Edit</button>
          <button class="btn-result" onclick="openPointsModal('${team}','${p.code}')"><i class="fas fa-star"></i> Points</button>
        </td>
      </tr>`;
    }
    
    html += `</tbody></table></div>`;
    panel.innerHTML = html;
  }
}

function renderStandings() {
  const container = document.getElementById("standingsTab");
  const teams = ["othello", "macbeth", "hamlet"];
  let teamPoints = [];
  for(let team of teams) {
    const assign = getTeamAssignments(team);
    let total = 0;
    for(let code in assign) total += assign[code].pointsEarned || 0;
    teamPoints.push({ team, points: total });
  }
  teamPoints.sort((a,b) => b.points - a.points);
  
  const teamIcons = { othello: "fa-mask", macbeth: "fa-crown", hamlet: "fa-skull" };
  const teamColors = { othello: "#1e5f4b", macbeth: "#5a1e2a", hamlet: "#2c2e3a" };
  
  let html = `<div class="team-points-card">`;
  for(let i = 0; i < teamPoints.length; i++) {
    const tp = teamPoints[i];
    html += `<div class="team-card" style="border-left:4px solid ${teamColors[tp.team]}">
      <h3><i class="fas ${teamIcons[tp.team]}"></i> ${tp.team.toUpperCase()}</h3>
      <div class="points">${tp.points} pts</div>
      <div>${i === 0 ? '🥇 1st Place' : i === 1 ? '🥈 2nd Place' : i === 2 ? '🥉 3rd Place' : ''}</div>
    </div>`;
  }
  html += `</div>`;
  
  const sortedStudents = [...students].sort((a,b) => b.points - a.points);
  html += `<div class="stats-bar"><span><i class="fas fa-medal"></i> STUDENT LEADERBOARD</span><span class="count-badge">${students.length} Students</span></div>
    <div class="table-wrapper"><table><thead><tr><th>Rank</th><th>ID</th><th>Name</th><th>Team</th><th>Points</th><th>Programs</th></tr></thead><tbody>`;
  
  for(let i = 0; i < sortedStudents.length; i++) {
    const s = sortedStudents[i];
    const teamColor = { othello: "#1e5f4b", macbeth: "#5a1e2a", hamlet: "#2c2e3a" }[s.team];
    html += `<tr>
      <td><strong>${i + 1}</strong> ${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : ''}</td>
      <td>${s.id}</td>
      <td><strong>${s.name}</strong></td>
      <td><span class="badge" style="background:${teamColor};color:white">${s.team.toUpperCase()}</span></td>
      <td>${s.points}</td>
      <td>${s.programs.length}</td>
    </tr>`;
  }
  html += `</tbody></table></div>`;
  container.innerHTML = html;
}

function renderStudents() {
  const container = document.getElementById("studentsTab");
  const teamColors = { othello: "#1e5f4b", macbeth: "#5a1e2a", hamlet: "#2c2e3a" };
  
  let html = `<div class="stats-bar"><span><i class="fas fa-user-graduate"></i> ALL STUDENTS (10 per team)</span><span class="count-badge">${students.length} Students</span></div>
    <div class="table-wrapper"><table><thead><tr><th>ID</th><th>Name</th><th>Team</th><th>Points</th><th>Programs</th><th>Action</th></tr></thead><tbody>`;
  
  for(let s of students) {
    html += `<tr>
      <td>${s.id}</td>
      <td><strong>${s.name}</strong></td>
      <td><span class="badge" style="background:${teamColors[s.team]};color:white">${s.team.toUpperCase()}</span></td>
      <td>${s.points}</td>
      <td>${s.programs.length}</td>
      <td><button class="btn-edit" onclick="editStudent('${s.id}')"><i class="fas fa-pen"></i> Edit</button></td>
    </tr>`;
  }
  html += `</tbody></table></div>`;
  container.innerHTML = html;
}

function openPointsModal(team, code) {
  currentPointsTarget = { team, code };
  const assign = getTeamAssignments(team);
  const prog = programs.find(p => p.code === code);
  if(!prog) return;
  document.getElementById("pointsProgName").value = `${prog.code} - ${prog.name}`;
  document.getElementById("pointsTeamName").value = team.toUpperCase();
  document.getElementById("pointsMaxVal").value = prog.maxPoints;
  document.getElementById("pointsEarnedVal").value = assign[code]?.pointsEarned || 0;
  document.getElementById("pointsModal").classList.add("active");
}

function savePoints() {
  if(!currentPointsTarget) return;
  const { team, code } = currentPointsTarget;
  const assign = getTeamAssignments(team);
  const prog = programs.find(p => p.code === code);
  if(assign[code]) {
    assign[code].pointsEarned = Math.min(parseInt(document.getElementById("pointsEarnedVal").value), prog.maxPoints);
    setTeamAssignments(team, assign);
    renderAll();
  }
  closeModal("pointsModal");
}

function openCandidatesModal(team, code) {
  currentCandidatesTarget = { team, code };
  const assign = getTeamAssignments(team);
  const prog = programs.find(p => p.code === code);
  document.getElementById("candProgName").innerText = `${prog.code} - ${prog.name}`;
  document.getElementById("candTeamName").innerText = team.toUpperCase();
  document.getElementById("candList").value = (assign[code]?.candidates || []).join(", ");
  document.getElementById("candidatesModal").classList.add("active");
}

function saveCandidates() {
  if(!currentCandidatesTarget) return;
  const { team, code } = currentCandidatesTarget;
  const assign = getTeamAssignments(team);
  if(!assign[code]) assign[code] = { candidates: [], pointsEarned: 0 };
  assign[code].candidates = document.getElementById("candList").value.split(",").map(s=>s.trim()).filter(s=>s);
  setTeamAssignments(team, assign);
  renderAll();
  closeModal("candidatesModal");
}

function editStudent(id) {
  const student = students.find(s => s.id === id);
  if(!student) return;
  const newName = prompt("Edit student name:", student.name);
  if(newName && newName.trim()) {
    student.name = newName.trim();
    saveToLocal();
    renderAll();
  }
}

function closeModal(id) { 
  document.getElementById(id).classList.remove("active"); 
  currentPointsTarget = null; 
  currentCandidatesTarget = null;
}

function logout() { sessionStorage.clear(); window.location.href = "index.html"; }

// Tab switching
document.querySelectorAll(".main-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".main-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(tc => tc.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.tab + "Tab").classList.add("active");
  });
});

document.querySelectorAll(".team-subtab").forEach(st => {
  st.addEventListener("click", () => {
    document.querySelectorAll(".team-subtab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".team-panel").forEach(tp => tp.classList.remove("active"));
    st.classList.add("active");
    document.getElementById(st.dataset.team + "Panel").classList.add("active");
  });
});

initData();
renderAll();
