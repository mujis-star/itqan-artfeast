<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITQAN Artsfest 2K26 · Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:#f4efe3;}
    .container{max-width:1600px;margin:0 auto;padding:1.5rem;}
    .header{background:linear-gradient(135deg,#1e3a2f,#0a2a1a);padding:1rem 1.8rem;border-radius:1.5rem;margin-bottom:1.8rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
    .header h1{color:#f9efda;font-size:1.5rem;}
    .logout-btn{background:#e8d5c0;color:#5a2d0e;padding:0.4rem 1rem;border-radius:2rem;border:none;cursor:pointer;}
    .refresh-btn{background:#d4a574;color:white;padding:0.4rem 1rem;border-radius:2rem;border:none;cursor:pointer;margin-left:0.5rem;}
    .main-tabs{display:flex;gap:0.8rem;margin-bottom:1.8rem;flex-wrap:wrap;background:#e9e2d4;padding:0.5rem;border-radius:3rem;width:fit-content;}
    .main-tab{padding:0.65rem 2rem;background:transparent;border:none;font-size:1rem;font-weight:700;cursor:pointer;border-radius:2rem;color:#3e2e1f;}
    .main-tab.active{background:#1e3a2f;color:white;}
    .tab-content{display:none;animation:fade 0.2s;}
    .tab-content.active{display:block;}
    @keyframes fade{from{opacity:0;}to{opacity:1;}}
    .stats-bar{background:white;padding:0.7rem 1.2rem;border-radius:1rem;margin-bottom:1.2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
    .loading{text-align:center;padding:2rem;color:#8a7a5a;}
    .table-wrapper{overflow-x:auto;background:white;border-radius:1rem;max-height:60vh;overflow-y:auto;border:1px solid #ede3d2;}
    table{width:100%;border-collapse:collapse;font-size:0.75rem;min-width:900px;}
    th{text-align:left;padding:0.8rem 0.6rem;background:#faf6ef;position:sticky;top:0;border-bottom:2px solid #e9dfcf;}
    td{padding:0.7rem 0.6rem;border-bottom:1px solid #f1e9dd;}
    tr:hover td{background:#fefaf2;}
    .badge{display:inline-block;padding:0.15rem 0.6rem;border-radius:2rem;font-size:0.65rem;font-weight:600;}
    .stage-badge{background:#236b4c;color:white;}
    .nonstage-badge{background:#9b7b5c;color:white;}
    .group-badge{background:#2c6b8f;color:white;}
    .sports-badge{background:#d97c2b;color:white;}
    .team-subtabs{display:flex;gap:0.8rem;margin-bottom:1.5rem;flex-wrap:wrap;}
    .team-subtab{padding:0.5rem 1.5rem;background:#e9e2d4;border:none;border-radius:2rem;cursor:pointer;font-weight:600;}
    .team-subtab.active{background:#1e3a2f;color:white;}
    .team-panel{display:none;}
    .team-panel.active{display:block;}
    .team-points-card{background:white;border-radius:1rem;padding:1rem;margin-bottom:1.5rem;display:flex;gap:1rem;flex-wrap:wrap;justify-content:space-around;}
    .team-card{text-align:center;padding:1rem;border-radius:1rem;min-width:150px;background:linear-gradient(135deg,#f9efda,#f0eade);}
    .team-card .points{font-size:2rem;font-weight:800;color:#1e3a2f;}
    footer{text-align:center;margin-top:1.5rem;font-size:0.7rem;color:#a48e72;}
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><i class="fas fa-trophy"></i> ITQAN Artsfest 2K26 · Admin Dashboard</h1>
    <div>
      <button class="refresh-btn" onclick="loadAllData()"><i class="fas fa-sync-alt"></i> Sync with Sheet</button>
      <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </div>

  <div class="main-tabs">
    <button class="main-tab active" data-tab="programs"><i class="fas fa-list"></i> Programs</button>
    <button class="main-tab" data-tab="standings"><i class="fas fa-medal"></i> Team Standings</button>
    <button class="main-tab" data-tab="students"><i class="fas fa-users"></i> Students</button>
  </div>

  <div id="programsTab" class="tab-content active">
    <div class="team-subtabs">
      <button class="team-subtab active" data-team="othello"><i class="fas fa-mask"></i> Othello</button>
      <button class="team-subtab" data-team="macbeth"><i class="fas fa-crown"></i> Macbeth</button>
      <button class="team-subtab" data-team="hamlet"><i class="fas fa-skull"></i> Hamlet</button>
    </div>
    
    <div id="othelloPanel" class="team-panel active"><div class="loading">Loading programs from Google Sheets...</div></div>
    <div id="macbethPanel" class="team-panel"><div class="loading">Loading programs from Google Sheets...</div></div>
    <div id="hamletPanel" class="team-panel"><div class="loading">Loading programs from Google Sheets...</div></div>
  </div>

  <div id="standingsTab" class="tab-content"><div class="loading">Loading standings...</div></div>
  <div id="studentsTab" class="tab-content"><div class="loading">Loading students...</div></div>
  <footer><i class="fas fa-google"></i> Data syncs from Google Sheets · Click "Sync with Sheet" to refresh</footer>
</div>

<script>
if(sessionStorage.getItem("user_team") !== "admin") { sessionStorage.clear(); window.location.href="index.html"; }

// ============ REPLACE THESE WITH YOUR GOOGLE SHEET IDs ============
// Steps to get your sheet ID:
// 1. Open your Google Sheet
// 2. The URL looks like: https://docs.google.com/spreadsheets/d/1ABC123xyz/edit
// 3. Copy the "1ABC123xyz" part and paste below

const GOOGLE_SHEET_ID = "YOUR_SHEET_ID_HERE";  // <-- PASTE YOUR SHEET ID HERE

// Sheet names (tab names in your Google Sheet)
const SHEET_NAMES = {
  programs: "PROGRAMS",
  students: "STUDENTS",
  points: "POINTS",
  candidates_othello: "CANDIDATES_OTHELLO",
  candidates_macbeth: "CANDIDATES_MACBETH",
  candidates_hamlet: "CANDIDATES_HAMLET"
};

// ============ DATA STORAGE ============
let programs = [];
let students = [];
let points = [];
let candidates = { othello: {}, macbeth: {}, hamlet: {} };

// ============ LOAD DATA FROM GOOGLE SHEETS ============
async function fetchSheet(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  try {
    const response = await fetch(url);
    const csvText = await response.text();
    const rows = csvText.split('\n').filter(row => row.trim());
    const headers = rows[0].split(',').map(h => h.replace(/"/g, '').trim());
    const data = [];
    for(let i = 1; i < rows.length; i++) {
      const values = rows[i].split(',').map(v => v.replace(/"/g, '').trim());
      if(values.length >= headers.length && values[0]) {
        const row = {};
        headers.forEach((h, idx) => { row[h] = values[idx] || ''; });
        data.push(row);
      }
    }
    return data;
  } catch(e) {
    console.error(`Error loading ${sheetName}:`, e);
    return [];
  }
}

async function loadAllData() {
  document.querySelectorAll('.loading').forEach(el => el.innerHTML = '<div class="loading">Loading from Google Sheets...</div>');
  
  try {
    // Load all sheets in parallel
    const [progData, studData, pointsData, candOth, candMac, candHam] = await Promise.all([
      fetchSheet(SHEET_NAMES.programs),
      fetchSheet(SHEET_NAMES.students),
      fetchSheet(SHEET_NAMES.points),
      fetchSheet(SHEET_NAMES.candidates_othello),
      fetchSheet(SHEET_NAMES.candidates_macbeth),
      fetchSheet(SHEET_NAMES.candidates_hamlet)
    ]);
    
    programs = progData;
    students = studData;
    points = pointsData;
    
    // Process candidates
    candidates.othello = {};
    candOth.forEach(c => { if(c.programCode) candidates.othello[c.programCode] = c.candidates || ''; });
    candidates.macbeth = {};
    candMac.forEach(c => { if(c.programCode) candidates.macbeth[c.programCode] = c.candidates || ''; });
    candidates.hamlet = {};
    candHam.forEach(c => { if(c.programCode) candidates.hamlet[c.programCode] = c.candidates || ''; });
    
    // Calculate student points
    students.forEach(s => { s.totalPoints = 0; s.programCount = 0; });
    points.forEach(p => {
      const student = students.find(s => s.id === p.studentId || s.name === p.studentName);
      if(student) {
        student.totalPoints = (student.totalPoints || 0) + parseInt(p.pointsEarned || 0);
        student.programCount = (student.programCount || 0) + 1;
      }
    });
    
    renderAll();
  } catch(e) {
    console.error("Error loading data:", e);
    document.querySelectorAll('.loading').forEach(el => el.innerHTML = '<div class="loading">❌ Error loading data. Check sheet ID and publishing settings.</div>');
  }
}

function renderAll() {
  renderProgramPanels();
  renderStandings();
  renderStudents();
}

function renderProgramPanels() {
  const teams = ["othello", "macbeth", "hamlet"];
  teams.forEach(team => {
    const panel = document.getElementById(`${team}Panel`);
    if(!panel) return;
    
    if(programs.length === 0) {
      panel.innerHTML = '<div class="loading">No programs found. Add data to your PROGRAMS sheet.</div>';
      return;
    }
    
    const teamCandidates = candidates[team] || {};
    const teamPoints = points.filter(p => p.team === team);
    
    let html = `
      <div class="stats-bar"><span>${team.toUpperCase()} TEAM - ${programs.length} Programs</span></div>
      <div class="table-wrapper"><table>
        <thead><tr><th>Code</th><th>Program Name</th><th>Time</th><th>Category</th><th>Candidates</th><th>Points</th></tr></thead>
        <tbody>
    `;
    
    programs.forEach(p => {
      const catClass = p.category === "Stage" ? "stage-badge" : p.category === "Non-Stage" ? "nonstage-badge" : p.category === "Group" ? "group-badge" : "sports-badge";
      const candidateList = teamCandidates[p.code] || '';
      const programPoints = teamPoints.find(tp => tp.programCode === p.code);
      const earnedPoints = programPoints ? programPoints.pointsEarned : 0;
      
      html += `<tr>
        <td><strong>${p.code}</strong></td>
        <td>${p.name}</td>
        <td>${p.time}</td>
        <td><span class="badge ${catClass}">${p.category}</span></td>
        <td><span class="candidate-tag">${candidateList || '-'}</span></td>
        <td><strong>${earnedPoints}</strong> / ${p.maxPoints}</td>
      </tr>`;
    });
    
    html += `</tbody></table></div>`;
    panel.innerHTML = html;
  });
}

function renderStandings() {
  const container = document.getElementById("standingsTab");
  if(!container) return;
  
  // Calculate team totals
  const teams = ["othello", "macbeth", "hamlet"];
  const teamTotals = teams.map(team => {
    const teamPoints = points.filter(p => p.team === team);
    const total = teamPoints.reduce((sum, p) => sum + parseInt(p.pointsEarned || 0), 0);
    return { team, points: total };
  });
  teamTotals.sort((a,b) => b.points - a.points);
  
  const teamIcons = { othello: "fa-mask", macbeth: "fa-crown", hamlet: "fa-skull" };
  const teamColors = { othello: "#1e5f4b", macbeth: "#5a1e2a", hamlet: "#2c2e3a" };
  
  let standingsHtml = `<div class="team-points-card">`;
  teamTotals.forEach((tp, idx) => {
    standingsHtml += `
      <div class="team-card" style="border-left:4px solid ${teamColors[tp.team]}">
        <h3><i class="fas ${teamIcons[tp.team]}"></i> ${tp.team.toUpperCase()}</h3>
        <div class="points">${tp.points} pts</div>
        <div>${idx === 0 ? '🥇 1st Place' : idx === 1 ? '🥈 2nd Place' : idx === 2 ? '🥉 3rd Place' : ''}</div>
      </div>
    `;
  });
  standingsHtml += `</div>`;
  
  // Student leaderboard
  const sortedStudents = [...students].sort((a,b) => (b.totalPoints || 0) - (a.totalPoints || 0));
  standingsHtml += `
    <div class="stats-bar"><span><i class="fas fa-medal"></i> STUDENT LEADERBOARD</span></div>
    <div class="table-wrapper"><table>
      <thead><tr><th>Rank</th><th>ID</th><th>Name</th><th>Team</th><th>Total Points</th><th>Programs</th></tr></thead>
      <tbody>
  `;
  
  sortedStudents.forEach((s, idx) => {
    const teamColor = { othello: "#1e5f4b", macbeth: "#5a1e2a", hamlet: "#2c2e3a" }[s.team];
    standingsHtml += `<tr>
      <td><strong>${idx + 1}</strong> ${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : ''}</td>
      <td>${s.id}</td>
      <td>${s.name}</td>
      <td><span class="badge" style="background:${teamColor};color:white">${(s.team || '').toUpperCase()}</span></td>
      <td><strong>${s.totalPoints || 0}</strong></td>
      <td>${s.programCount || 0}</td>
    </tr>`;
  });
  
  standingsHtml += `</tbody></table></div>`;
  container.innerHTML = standingsHtml;
}

function renderStudents() {
  const container = document.getElementById("studentsTab");
  if(!container) return;
  
  const teamColors = { othello: "#1e5f4b", macbeth: "#5a1e2a", hamlet: "#2c2e3a" };
  
  let html = `
    <div class="stats-bar"><span><i class="fas fa-user-graduate"></i> ALL STUDENTS</span></div>
    <div class="table-wrapper"><table>
      <thead><tr><th>ID</th><th>Name</th><th>Team</th><th>Total Points</th><th>Programs</th></tr></thead>
      <tbody>
  `;
  
  students.forEach(s => {
    html += `<tr>
      <td>${s.id}</td>
      <td><strong>${s.name}</strong></td>
      <td><span class="badge" style="background:${teamColors[s.team]};color:white">${(s.team || '').toUpperCase()}</span></td>
      <td><strong>${s.totalPoints || 0}</strong></td>
      <td>${s.programCount || 0}</td>
    </tr>`;
  });
  
  html += `</tbody></table></div>`;
  container.innerHTML = html;
}

function logout() { sessionStorage.clear(); window.location.href = "index.html"; }

// Tab switching
document.querySelectorAll(".main-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".main-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(tc => tc.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.tab + "Tab").classList.add("active");
  });
});

document.querySelectorAll(".team-subtab").forEach(st => {
  st.addEventListener("click", () => {
    document.querySelectorAll(".team-subtab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".team-panel").forEach(tp => tp.classList.remove("active"));
    st.classList.add("active");
    document.getElementById(st.dataset.team + "Panel").classList.add("active");
  });
});

// Load data on page load
loadAllData();
</script>
</body>
</html>
